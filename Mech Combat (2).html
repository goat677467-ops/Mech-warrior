</div>
<div id="tc">

</div>
<div id="ov"><h1 id="ot">MECH COMBAT</h1><p id="op">Four stages. One boss. Desktop: WASD to move, mouse to aim, click to fire, Space to boost. Touch: left stick moves, right stick aims, use the FIRE and BOOST buttons.</p><button id="ob">DEPLOY</button></div>

// arena

function mech(col,s,vis){

 B(T,1.5,1.1,.9,a,0,.75,0);B(T,1.15,.7,.2,lt,0,.8,.5);

 [-1,1].forEach(k=>{
  B(T,.55,.5,.7,lt,k*1.0,1.3,-.05);

// state
const pm=mech(0x0077ff,1,0x00ffff);scene.add(pm);

const dir=new THREE.Vector3(),aimT=new THREE.Vector3(),v1=new THREE.Vector3(),v2=new THREE.Vector3(),v3=new THREE.Vector3(),vt=new THREE.Vector3();

const ST=[
 {n:'NOOBMILAN SWARM',k:5,c:0xcc2200,v:0xffdd00,s:.8,hp:30,sp:9,pf:12,fr:1.3,dm:4,bs:34,sd:.08,bz:.28},
 {n:'LEO CHARGERS',k:5,c:0xcc00cc,v:0xffffff,s:1.1,hp:70,sp:8,pf:3,fr:1.1,dm:5,bs:36,sd:.1,bz:.3},
 {n:'ADVAITKUNDAN SNIPERS',k:5,c:0x00cc44,v:0xff4040,s:1.35,hp:120,sp:3.2,pf:32,fr:2.8,dm:16,bs:60,sd:.03,bz:.45},
 {n:'FINAL BOSS: BADBASIL67',k:1,c:0xffa000,v:0xff2200,s:2.5,hp:800,sp:3,pf:22,fr:1.5,dm:7,bs:48,sd:.05,bz:.5,bu:1}];
// audio
let AC;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}

function noise(d,v,fc){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

// fx
const pg=new THREE.BoxGeometry(1,1,1),bg=new THREE.SphereGeometry(1,8,8),bmP=new THREE.MeshBasicMaterial({color:0x55f0ff}),bmE=new THREE.MeshBasicMaterial({color:0xff2a2a});
function part(x,y,z,vx,vy2,vz,c,sz,life){if(fx.length>320)return;const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:c,transparent:true}));m.position.set(x,y,z);m.scale.setScalar(sz);scene.add(m);fx.push({m,vx,vy:vy2,vz,life,max:life,sz})}

 if(f.life<=0){scene.remove(m);m.material.dispose();fx.splice(i,1)}else{const r=f.life/f.max;m.material.opacity=r;m.scale.setScalar(f.sz*(.4+.6*r));m.rotation.x+=dt*5}}}

function startStage(i){stage=i;const t=ST[i];hold=2.4;$('boss').style.display=i===3?'block':'none';
 for(let j=0;j<t.k;j++){const m=mech(t.c,t.s,t.v),a=Math.PI*2*j/t.k+Math.random()*.6,r=t.k===1?32:26+Math.random()*14;

function end(w){state='over';try{document.exitPointerLock()}catch(e){}md=tf=tb=0;
 $('ot').textContent=w?'SECTOR SECURED':'MECH DESTROYED';$('op').textContent=w?'All four stages cleared. BADBASIL67 is down.':'You fell on stage '+(stage+1)+' of 4.';$('ob').textContent=w?'PLAY AGAIN':'RETRY';
 setTimeout(()=>{$('ov').style.display='flex'},w?400:1000)}

function shoot(){

function update(dt){
 time+=dt;
 let fi=(K.KeyW?1:0)-(K.KeyS?1:0)+TJ.ly,si=(K.KeyD?1:0)-(K.KeyA?1:0)+TJ.lx;

 else{bat=Math.min(100,bat+16*dt);if(bcool&&bat>=30)bcool=false}

   v3.set(P.x,P.y+2.6,P.z).sub(v2).normalize();v3.x+=(Math.random()-.5)*t.sd;v3.y+=(Math.random()-.5)*t.sd;v3.z+=(Math.random()-.5)*t.sd;v3.normalize();

 }
 for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j],dx=b.m.position.x-a.m.position.x,dz=b.m.position.z-a.m.position.z,l=Math.hypot(dx,dz)||.01,mn=1.8*(a.s+b.s);

 for(let i=bolts.length-1;i>=0;i--){const b=bolts[i],m=b.m;m.position.addScaledVector(b.v,dt);b.life-=dt;let dead=b.life<=0||m.position.y<0;

   if(d2(m.position,e.m.position.x,e.m.position.y+2.4*e.s,e.m.position.z)<r*r){e.hp-=b.dmg;dead=true;boom(m.position,0xffaa33,6,.18,7);play('hit',50);if(e.hp<=0)kill(e,j);break}}}
  else if(!dead&&!b.own&&state==='play'&&d2(m.position,P.x,P.y+2.6,P.z)<3.6){dead=true;boom(m.position,0xff3333,8,.2,8);play('hit',60);hurt(b.dmg)}
  if(dead){scene.remove(m);bolts.splice(i,1)}}
 // flow
 if(state!=='play')return;
 if(!enemies.length&&clearT<0){if(stage>=3){end(true);return}clearT=2.2;banner('STAGE CLEARED',ST[stage+1].n,2.2)}
 if(clearT>=0){clearT-=dt;if(clearT<0){hp=Math.min(100,hp+35);bat=100;bcool=false;startStage(stage+1)}}
 // hud
 hitA=Math.max(0,hitA-dt*1.6);$('hit').style.opacity=hitA;
 const h=Math.ceil(hp),b=Math.ceil(bat);
 $('hl').textContent='HULL '+h+'%';$('hf').style.width=h+'%';$('hf').classList.toggle('lo',h<30);
 $('bl').textContent='BOOST '+b+'%'+(bcool?' RECHARGING':'');$('bu').style.width=b+'%';
 $('sn').textContent=(stage+1)+'/4 '+ST[stage].n;$('en').textContent='HOSTILES '+enemies.length;
 if(stage===3&&enemies[0])$('bh').style.width=(enemies[0].hp/enemies[0].max*100)+'%';
}
function reset(){enemies.forEach(e=>scene.remove(e.m));enemies.length=0;bolts.forEach(b=>scene.remove(b.m));bolts.length=0;fx.forEach(f=>{scene.remove(f.m);f.m.material.dispose()});fx.length=0;
 hp=100;bat=100;bcool=false;vy=0;P.set(0,0,0);yaw=0;pitch=.1;clearT=-1;shake=0;pm.visible=true;startStage(0)}
// input
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('contextmenu',e=>e.preventDefault());
$('c').addEventListener('mousedown',e=>{if(state!=='play'||e.button!==0)return;md=1;if(!TOUCH&&document.pointerLockElement!==$('c')){try{const p=$('c').requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(x){}}});
addEventListener('mouseup',e=>{if(e.button===0)md=0});
addEventListener('mousemove',e=>{if(state==='play'&&(document.pointerLockElement===$('c')||md)){yaw-=(e.movementX||0)*.0025;pitch=cl(pitch-(e.movementY||0)*.002,-.35,.5)}});
function stick(id,kx,ky){const z=$(id),k=z.querySelector('i');let pid=null,ox=0,oy=0;
 z.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;ox=e.clientX;oy=e.clientY;try{z.setPointerCapture(pid)}catch(x){}});
 z.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;let dx=(e.clientX-ox)/50,dy=(e.clientY-oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}TJ[kx]=dx;TJ[ky]=-dy;k.style.transform='translate('+dx*40+'px,'+dy*40+'px)'});
 const up=e=>{if(e.pointerId!==pid)return;pid=null;TJ[kx]=TJ[ky]=0;k.style.transform=''};
 z.addEventListener('pointerup',up);z.addEventListener('pointercancel',up)}
function hold_(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}fn(1);b.classList.add('on')});
 ['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,()=>{fn(0);b.classList.remove('on')}))}
stick('zl','lx','ly');stick('zr','rx','ry');hold_('bf',v=>{tf=v});hold_('bb',v=>{tb=v});
$('ob').addEventListener('click',()=>{ac();reset();state='play';$('ov').style.display='none';
 if(!TOUCH){try{const p=$('c').requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(x){}}});
// loop
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;
 if(state==='play')update(dt);
 else{const a=n/3500;cam.position.set(P.x+Math.sin(a)*15,6,P.z+Math.cos(a)*15);cam.lookAt(P.x,3,P.z);walk(pm,dt,0,false)}
 fxUpdate(dt);R.render(scene,cam)}
requestAnimationFrame(loop);
})();
